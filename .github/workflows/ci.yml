
name: Tests and builds

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
          - macos-26
          - macos-26-intel

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Configure parser tests
        run: cmake -S tests -B build/tests -DCMAKE_BUILD_TYPE=Release

      - name: Build and test
        run: |
          cmake --build build/tests --parallel 2
          ctest --test-dir build/tests --output-on-failure

      - name: Check scripts and pack
        run: |
          bash -n scripts/build.sh
          python3 -m py_compile \
            scripts/patch-sdk.py \
            scripts/package-binary.py \
            tests/integration.py \
            tests/live_support.py
          python3 -m json.tool configs/dns-events.pack.json > /dev/null
          python3 -c "import plistlib; plistlib.load(open('configs/dns.mobileconfig', 'rb'))"

  extension-build:
    name: Build (${{ matrix.os }}, ${{ matrix.arch }})
    needs: offline-tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: x86_64

    env:
      DNS_BUILD_JOBS: 3

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build extension
        run: bash ./scripts/build.sh

      - name: Validate architecture
        run: |
          test "$(lipo -archs build/dns_events.ext)" = "${{ matrix.arch }}"
          codesign --verify build/dns_events.ext

      - name: Package extension
        run: |
          python3 scripts/package-binary.py \
            --architecture "${{ matrix.arch }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dns-events-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            build/dns_events.ext
            build/dist/*.tar.gz
            build/dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
