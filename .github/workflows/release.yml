
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Release build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64

    env:
      DNS_BUILD_JOBS: 3

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - "$RELEASE_TAG" <<'PY'
          import pathlib
          import re
          import sys

          tag = sys.argv[1]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit("Expected release tag vMAJOR.MINOR.PATCH")

          source = pathlib.Path("src/main.cpp").read_text()
          match = re.search(
              r'startExtension\("dns_events",\s*"([0-9.]+)"',
              source,
          )
          if not match or match.group(1) != tag[1:]:
              raise SystemExit("Release tag does not match extension version")
          PY

      - name: Build extension
        run: bash ./scripts/build.sh

      - name: Verify binary
        shell: bash
        run: |
          set -euo pipefail
          test "$(lipo -archs build/dns_events.ext)" = "${{ matrix.arch }}"
          codesign --verify build/dns_events.ext

      - name: Package licenses and configuration
        run: |
          python3 scripts/package-binary.py \
            --architecture "${{ matrix.arch }}"

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/release

          cp build/dns_events.ext \
            "build/release/dns_events-${{ matrix.arch }}.ext"

          cp build/dist/*.tar.gz build/release/

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.arch }}
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Validate and checksum
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/dns_events-arm64.ext
          test -f dist/dns_events-x86_64.ext

          test "$(find dist -maxdepth 1 -name '*.ext' | wc -l | tr -d ' ')" -eq 2
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" -eq 2

          cd dist
          sha256sum ./*.ext ./*.tar.gz > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release exists, uploading assets"
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
